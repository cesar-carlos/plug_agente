name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Short version, for example 1.6.6"
        required: true
        type: string
      build_number:
        description: "Build suffix used in pubspec.yaml"
        required: true
        type: string
        default: "1"
      run_tests:
        description: "Run flutter analyze and flutter test before publishing"
        required: true
        type: boolean
        default: true
      signing_provider:
        description: "Official trust provider: Ed25519 manifests without Authenticode"
        required: true
        type: choice
        default: manifest
        options:
          - manifest
      prerelease:
        description: "Publish as a prerelease"
        required: true
        type: boolean
        default: false
      dry_run:
        description: "Build and validate without committing, tagging, or publishing"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERSION_SHORT: ${{ inputs.version }}
  FULL_VERSION: ${{ inputs.version }}+${{ inputs.build_number }}
  RELEASE_TAG: v${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.prerelease && 'beta' || 'stable' }}
  OFFICIAL_FEED_URL: https://cesar-carlos.github.io/plug_agente/appcast.xml

concurrency:
  group: publish-windows-release-${{ inputs.version }}
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-2022
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || 'main' }}
          fetch-depth: 0

      - name: Record immutable revision
        id: revision
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Require coordinated persona-v2 acceptance
        if: ${{ !inputs.dry_run }}
        run: python tool/release/check_persona_release.py --tag "$env:RELEASE_TAG" --build "$env:FULL_VERSION" --channel "$env:RELEASE_CHANNEL"

      - name: Require production release gates
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          FEED_KEY: ${{ secrets.APPCAST_SIGNING_PRIVATE_KEY }}
          FEED_PUBLIC_KEY: ${{ secrets.AUTO_UPDATE_FEED_PUBLIC_KEY }}
        run: |
          if ('${{ inputs.run_tests }}' -ne 'true') { throw 'Production requires tests.' }
          if (!$env:FEED_KEY -or !$env:FEED_PUBLIC_KEY) { throw "Production requires feed signing keys." }


  quality:
    needs: prepare
    runs-on: windows-2022
    outputs:
      source_tree: ${{ steps.source.outputs.tree }}
    steps:
      - name: Checkout prepared revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --quiet "cryptography>=42.0.0" "jsonschema>=4.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Prepare versioned source
        id: source
        run: python -m tool.release.prepared_source

      - name: Release quality gate
        if: inputs.run_tests
        run: python tool/release/release_preflight.py --gate --allow-dirty --allow-existing-tag

      - name: Test installer contracts when the full gate is disabled
        if: ${{ !inputs.run_tests }}
        run: python -m unittest tool.updater.test_installer -v

      - name: Test installer recovery and warning reports
        run: python -m unittest tool.updater.test_installer_recovery tool.updater.test_installer_manual_upgrade tool.updater.test_installer_preparation_guard tool.updater.test_windows_installation_validation tool.release.test_signpath_staging -v

      - name: Check dependency and SDK generated files
        shell: bash
        env:
          EXPECTED_SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: git diff --exit-code "$EXPECTED_SOURCE_TREE" --

      - name: Preserve quality diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release-preflight/*.log
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: prepare
    runs-on: windows-2022
    outputs:
      source_tree: ${{ steps.source.outputs.tree }}
      installer_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout prepared revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Python dependencies
        run: python -m pip install --quiet "cryptography>=42.0.0" "jsonschema>=4.0.0"

      - name: Early release preflight
        shell: bash
        run: |
          ARGS=(--early --version "$VERSION_SHORT" --require-iscc --signing-provider "${{ inputs.signing_provider }}" --allow-existing-tag)
          python tool/release/release_preflight.py "${ARGS[@]}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Prepare versioned source
        id: source
        run: python -m tool.release.prepared_source

      - name: Verify existing release tag source
        if: ${{ !inputs.dry_run }}
        run: python -m tool.release.publish_release --check-tag

      - name: Build installer without certificate
        env:
          AUTO_UPDATE_FEED_URL: ${{ env.OFFICIAL_FEED_URL }}
          AUTO_UPDATE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          AUTO_UPDATE_REQUIRE_VALID_SIGNATURE: 'false'
          AUTO_UPDATE_FEED_PUBLIC_KEY: ${{ secrets.AUTO_UPDATE_FEED_PUBLIC_KEY }}
          AUTO_UPDATE_REQUIRE_FEED_SIGNATURE: 'true'
          WINDOWS_CODE_SIGNING_REQUIRED: 'false'
          SIGNING_PROVIDER: manifest
        run: python installer/build_installer.py

      - name: Verify installed bundle startup and data access probes
        env:
          PLUG_INSTALL_CHECK_BUNDLE: build/windows/x64/runner/Release
        run: python -m unittest tool.updater.test_install_check -v

      - name: Validate generated installer
        env:
          AUTO_UPDATE_FEED_PUBLIC_KEY: ${{ secrets.AUTO_UPDATE_FEED_PUBLIC_KEY }}
        run: |
          python tool/release/release_preflight.py --version "${{ env.VERSION_SHORT }}" --allow-dirty --check-installer --allow-existing-tag --feed-public-key "$AUTO_UPDATE_FEED_PUBLIC_KEY"
        shell: bash

      - name: Test native updater contracts
        shell: pwsh
        run: |
          ctest --test-dir build/windows/x64/updater -C Release --output-on-failure --no-tests=error --output-junit "$env:RUNNER_TEMP/updater-contracts.xml"
          if ($LASTEXITCODE -ne 0) { throw "Native updater contract tests failed." }

      - name: Check dependency and SDK generated files
        shell: bash
        env:
          EXPECTED_SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: git diff --exit-code "$EXPECTED_SOURCE_TREE" --

      - name: Record installer digest
        id: digest
        shell: pwsh
        run: |
          $path = "installer/dist/PlugAgente-Setup-$env:VERSION_SHORT.exe"
          "sha256=$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Preserve prepared installer
        uses: actions/upload-artifact@v7
        with:
          name: prepared-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: installer/dist/PlugAgente-Setup-${{ inputs.version }}.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-preflight/*.log
            build/windows/x64/updater/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/updater-contracts.xml
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, quality, build]
    runs-on: windows-2022
    permissions:
      contents: write
      actions: write
    concurrency:
      group: plug-main-mutation
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout prepared revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install signature dependencies
        run: python -m pip install --quiet "cryptography>=42.0.0"

      - name: Require matching tested and built source
        shell: python
        env:
          TESTED_TREE: ${{ needs.quality.outputs.source_tree }}
          BUILT_TREE: ${{ needs.build.outputs.source_tree }}
        run: |
          import os
          if not os.environ['TESTED_TREE'] or os.environ['TESTED_TREE'] != os.environ['BUILT_TREE']:
              raise SystemExit('Tested and built source trees differ')

      - name: Prepare versioned source
        env:
          EXPECTED_SOURCE_TREE: ${{ needs.build.outputs.source_tree }}
        run: python -m tool.release.prepared_source

      - name: Download prepared installer from this attempt
        uses: actions/download-artifact@v8
        with:
          name: prepared-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: installer/dist

      - name: Verify prepared installer digest
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.installer_sha256 }}
        run: python -m tool.release.prepared_source --verify-installer

      - name: Reject stale preparation before publication
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          PREPARED_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$PREPARED_COMMIT" || { echo 'main changed during preparation; run preparation again.' >&2; exit 1; }

      - name: Require coordinated persona-v2 acceptance
        if: ${{ !inputs.dry_run }}
        run: python tool/release/check_persona_release.py --tag "$env:RELEASE_TAG" --build "$env:FULL_VERSION" --channel "$env:RELEASE_CHANNEL"

      - name: Commit version bump
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml installer/setup.iss lib/core/constants/app_version.g.dart
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            echo "Reusing the existing release tag source."
          elif git diff --staged --quiet; then
            echo "Version files are already synchronized; reusing the current commit."
          else
            git commit -m "chore: bump version to ${VERSION_SHORT}"
          fi
          git diff --exit-code

      - name: Generate signed updater manifest
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          APPCAST_SIGNING_PRIVATE_KEY: ${{ secrets.APPCAST_SIGNING_PRIVATE_KEY }}
        run: |
          SCHEMA=$(python -c "import re; from pathlib import Path; print(re.search(r'int get schemaVersion => ([0-9]+)', Path('lib/infrastructure/repositories/agent_config_drift_database.dart').read_text()).group(1))")
          SOURCE_COMMIT=$(python -m tool.release.publish_release --source-commit)
          python -m tool.updater.manifest --installer "installer/dist/PlugAgente-Setup-${VERSION_SHORT}.exe" --version "$FULL_VERSION" --channel "$RELEASE_CHANNEL" --schema "$SCHEMA" --source-commit "$SOURCE_COMMIT" --output "installer/dist/PlugAgente-Manifest-${VERSION_SHORT}.json"

      - name: Verify manifest and publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_UPDATE_FEED_PUBLIC_KEY: ${{ secrets.AUTO_UPDATE_FEED_PUBLIC_KEY }}
        run: python -m tool.release.publish_release

      - name: Dry run summary
        if: inputs.dry_run
        shell: bash
        run: |
          echo "Dry run completed for ${FULL_VERSION}."
          echo "Installer generated at installer/dist/PlugAgente-Setup-${VERSION_SHORT}.exe."
          echo "No commit, tag, or GitHub Release was created."

      - name: Preserve release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            installer/dist/PlugAgente-Manifest-*.json
          if-no-files-found: warn
          retention-days: 14

  publish-appcast:
    if: ${{ !inputs.dry_run }}
    needs: publish
    uses: ./.github/workflows/update-appcast.yml
    with:
      release_tag: v${{ inputs.version }}
      rollout_percentage: "5"
      preserve_existing_rollout: true
      channel: ${{ inputs.prerelease && 'beta' || 'stable' }}
    secrets: inherit
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write
