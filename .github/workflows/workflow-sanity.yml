name: Workflow Sanity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'tool/appcast/**'
      - 'tool/ci/**'
      - 'tool/release/**'
      - 'tool/tests/test_workflow_regressions.py'
      - 'tool/tests/test_validate_ci_configuration.py'
      - 'analysis_options.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'tool/appcast/**'
      - 'tool/ci/**'
      - 'tool/release/**'
      - 'tool/tests/test_workflow_regressions.py'
      - 'tool/tests/test_validate_ci_configuration.py'
      - 'analysis_options.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflow-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate CI configuration
        run: python3 tool/ci/validate_ci_configuration.py

      - name: Install workflow test dependencies
        run: python3 -m pip install --quiet "cryptography>=42.0.0" "PyYAML>=6.0,<7"

      - name: Run CI configuration tests
        run: python3 -m unittest tool.tests.test_validate_ci_configuration tool.tests.test_workflow_regressions tool.release.test_publish_release -v

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test scheduled workflow alerts
        run: node --test tool/ci/test_scheduled_workflow_alert.cjs

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        # actionlint 1.7.12 predates GitHub's concurrency.queue support.
        run: >-
          "$HOME/go/bin/actionlint"
          -ignore '^unexpected key "queue" for "concurrency" section\.'
