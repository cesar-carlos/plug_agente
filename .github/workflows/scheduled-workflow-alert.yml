name: Scheduled Workflow Alert

on:
  workflow_run:
    workflows:
      - Flutter CI
      - Validate Current Appcast
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: scheduled-workflow-alert-${{ github.event.workflow_run.workflow_id }}
  queue: max
  cancel-in-progress: false

jobs:
  alert-on-consecutive-failures:
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alert logic from the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Open or resolve a scheduled workflow alert
        uses: actions/github-script@v9
        with:
          script: |
            const scheduledWorkflowAlert = require('./tool/ci/scheduled_workflow_alert.cjs');
            await scheduledWorkflowAlert({ github, context, core });
