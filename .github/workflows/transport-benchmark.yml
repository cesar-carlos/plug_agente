name: Transport Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport-benchmark:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve comparison revision
        shell: bash
        run: echo "TRANSPORT_BASE_REVISION=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - name: Checkout transport comparison
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TRANSPORT_BASE_REVISION }}
          path: transport-base
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y unixodbc-dev

      - name: Install dependencies
        run: |
          flutter pub get
          python tool/odbc/prepare_package_native.py --github-env "${{ github.env }}"

      - name: Qualify transport with identical-code control and both revision orders
        id: transport-comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/benchmark
          python tool/benchmarks/prepare_transport_comparison.py \
            --base-dir transport-base \
            --output-dir artifacts/benchmark/transport \
            2>&1 | tee artifacts/benchmark/transport-comparison.log

      - name: Run transport benchmark suite
        if: ${{ !cancelled() && steps.transport-comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/benchmark
          python tool/benchmarks/run_benchmark_suite.py \
            --only transport_pipeline \
            --comparison-report artifacts/benchmark/transport/comparison.json \
            --skip-dart-tool 2>&1 | tee artifacts/benchmark/transport-benchmark.log

      - name: Report historical baseline compatibility (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p artifacts/benchmark
          latest="$(find benchmarks/results -mindepth 2 -maxdepth 2 -type f -name summary.json 2>/dev/null | sort -r | head -n 1)"
          if [ -z "$latest" ]; then
            echo "No benchmark summary produced; skipping baseline compare." | tee artifacts/benchmark/baseline-comparison.log
            exit 0
          fi
          python tool/benchmarks/compare_benchmark_summary.py \
            --baseline benchmarks/baseline/summary.json \
            --current "$latest" \
            --threshold 0.25 2>&1 | tee artifacts/benchmark/baseline-comparison.log

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transport-benchmark-${{ github.run_id }}
          path: |
            benchmarks/results/**/*
            artifacts/benchmark/**/*
          if-no-files-found: warn
